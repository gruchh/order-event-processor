spring.application.name=order-main
server.port=${PORT_MAIN_BACKEND:8080}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotent=true
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.group-id=order-processor-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.kafka.order_main.dto.OrderEvent

project.kafka.retry.attempts=3
project.kafka.retry.delay=2000
project.kafka.retry.multiplier=2.0

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}
spring.datasource.username=${DB_USER:spring_user}
spring.datasource.password=${DB_PASSWORD:spring_secure_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.user=${DB_USER:spring_user}
spring.flyway.password=${DB_PASSWORD:spring_secure_password}