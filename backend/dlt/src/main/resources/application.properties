spring.application.name=order-dlt-manager
server.port=${PORT_DLT_MANAGER:8081}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=order-dlt-manager-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.kafka.order.dlt.dto.OrderEvent

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}
spring.datasource.username=${DB_USER:spring_user}
spring.datasource.password=${DB_PASSWORD:spring_secure_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.user=${DB_USER:spring_user}
spring.flyway.password=${DB_PASSWORD:spring_secure_password}